get:
  tags:
    - Admin
  summary: Trigger an eHoldings entitlement sync
  description: >-
    Also run automatically every hour via Okapi's timer interface, which
    never sets force, always honouring the entitlement sync buffer window
  operationId: getAdminTriggerEntitlementEholdings
  parameters:
    - $ref: ../common/parameters/x-okapi-tenant.yaml
    - in: query
      name: force
      description: Bypass the entitlement sync buffer window
      required: false
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: OK
    '400':
      description: Bad request error
    '403':
      description: Forbidden
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../common/schemas/GrailsErrorResponse.yaml

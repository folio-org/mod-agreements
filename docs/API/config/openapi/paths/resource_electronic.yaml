description: Supports search of electronic resources (packages and electronic title instances) in the Agreements local knowledgebase
parameters:
  - $ref: ../common/parameters/x-okapi-tenant.yaml
get:
  tags:
    - Resources
  summary: Get a set of electronic resource records
  operationId: getElectronicResources
  parameters:
    $ref: ../common/parameters/queryParameters.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ErmResourceResults.yaml
              - $ref: ../components/schemas/ErmResourceResultsArray.yaml
    '400':
      description: Bad request error
    '403':
      description: Forbidden
    '500':
      description: Internal server error

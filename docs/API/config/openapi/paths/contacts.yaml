description: >-
  Supports search of Internal Contact records — a FOLIO user assigned a role
  (e.g. subject specialist) against a Subscription Agreement. GET only:
  contacts are created/updated/deleted through the owning agreement, not
  through this path directly.
parameters:
  - $ref: ../common/parameters/x-okapi-tenant.yaml
get:
  tags:
    - Internal Contacts
  summary: Get a set of Internal Contact records
  operationId: getContacts
  parameters:
    $ref: ../common/parameters/queryParameters.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/InternalContactResults.yaml
              - $ref: ../components/schemas/InternalContactResultsArray.yaml
    '400':
      description: Bad request error
    '403':
      description: Forbidden
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../common/schemas/GrailsErrorResponse.yaml

post:
  tags:
    - Admin
  summary: Queue a one-time OAI-PMH harvest of an enabled package
  description: >-
    Requires Harvest ingress mode and an existing tenant-local package with Harvest
    ingress metadata pointing to an active GOKB OAI package source. The source and
    GOKB UUID are derived from the package; callers cannot supply a source URL.
    Explicitly paused packages are rejected; a legacy null synchronization flag is
    treated as enabled. Duplicate queued or running pulls are rejected.
    Returns a background job ID; inspect GET /erm/jobs/{jobId} for completion and
    errors. The job rechecks synchronization state and refuses to overlap an active
    source harvest. It fetches GetRecord with metadataPrefix=gokb and applies the
    same package eligibility rules as bulk harvesting. Neither the synchronization
    setting nor the RemoteKB cursor or lastCheck is changed. Missing, deleted,
    ineligible or invalid upstream records fail the job without ingesting contents.
  operationId: postAdminPullPackage
  parameters:
    - $ref: ../common/parameters/x-okapi-tenant.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - packageId
          properties:
            packageId:
              type: string
              format: uuid
              description: Tenant-local package ID, not the GOKB UUID
  responses:
    '202':
      description: Package pull queued
      headers:
        Location:
          description: URL of the background job
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required:
              - jobId
            properties:
              jobId:
                type: string
                format: uuid
    '400':
      description: Missing or invalid packageId
    '403':
      description: Forbidden
    '404':
      description: Package not found in this tenant
    '409':
      description: Paused package, unsupported mode or source, missing identifier, or duplicate pull
    '500':
      description: Internal server error

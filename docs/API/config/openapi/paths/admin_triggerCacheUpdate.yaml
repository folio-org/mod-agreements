    - Admin
  summary: Trigger an update of the remote KB package cache
  operationId: getAdminTriggerCacheUpdate
  parameters:
    - $ref: ../common/parameters/x-okapi-tenant.yaml
  responses:
    '200':
      description: OK -- returns no response body
    '400':

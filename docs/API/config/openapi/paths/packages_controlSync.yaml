parameters:
  - $ref: ../common/parameters/x-okapi-tenant.yaml
post:
  tags:
  - Packages
  summary: Change the synchronisation status of a package
  description: >-
    In Harvest mode, changing a harvested package from PAUSED to SYNCHRONIZING
    requests a background resync that queues a one-time OAI GetRecord pull.
    This does not reset the source cursor or wait for the hourly harvest.
    An unchanged status does not request another resync. The response confirms
    the status change; monitor /erm/jobs for resync and pull completion or errors.
  operationId: postPackagecontrolSync
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - syncState
            - packageIds
          properties:
            syncState:
              type: string
              enum:
                - PAUSED
                - SYNCHRONIZING
            packageIds:
              type: array
              minItems: 1
              items:
                type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              packagesUpdated:
                type: integer
              packagesSkipped:
                type: integer
              success:
                type: boolean
    '400':
      description: Bad request error
    '403':
      description: Forbidden
    '500':
      description: Internal server error

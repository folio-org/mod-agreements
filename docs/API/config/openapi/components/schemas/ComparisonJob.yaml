type: object
properties:
  id:
    type: string
    format: uuid
  class:
    type: string
    enum:
      - org.olf.general.jobs.ComparisonJob
  name:
    type: string
  runnerId:
    type: string
  dateCreated:
    type: integer
  started:
    description: Null until the job begins running
    type: [string, "null"]
    format: date-time
  ended:
    description: Null until the job finishes
    type: [string, "null"]
    format: date-time
  status:
    oneOf:
      - type: string
      - $ref: ../../common/schemas/Refdata.yaml
  result:
    description: Null until the job finishes
    oneOf:
      - type: string
      - $ref: ../../common/schemas/Refdata.yaml
      - type: "null"
  fileUpload:
    oneOf:
      - $ref: ./File.yaml
      - type: "null"
  fullLogCount:
    type: integer
  errorLogCount:
    type: integer
  infoLogCount:
    type: integer
  comparisonPoints:
    type: array
    items:
      $ref: ./ComparisonPoint.yaml

type: object
properties:
  id:
    type: string
    format: uuid
  class:
    type: string
    enum:
      - org.olf.kb.TitleInstance
      - org.olf.kb.PlatformTitleInstance
      - org.olf.kb.PackageContentItem
      - org.olf.kb.Pkg
  coverage:
    type: array
    items:
      $ref: ./CoverageStatement.yaml
  customCoverage:
    type: boolean
  dateCreated:
    type: string
    format: date-time
  lastUpdated:
    type: string
    format: date-time
  name:
    type: string
  normalizedName:
    type: string
    readOnly: true
  description:
    type: string
  publicationType:
    oneOf:
      - type: string
      - $ref: ../../common/schemas/Refdata.yaml
  suppressFromDiscovery:
    type: boolean
  subType:
    oneOf:
      - type: string
      - $ref: ../../common/schemas/Refdata.yaml
  tags:
    type: array
    items:
      $ref: ./Tag.yaml
  type:
    oneOf:
      - type: string
      - $ref: ../../common/schemas/Refdata.yaml
  alternateResourceNames:
    type: array
    items: 
      $ref: ./AlternateResourceName.yaml
  identifiers:
    type: array
    items:
      $ref: ./IdentifierOccurrence.yaml
  _object:
    description: The full, type-specific representation of this resource (fields vary depending on `class`)
    oneOf:
      - $ref: ./TitleInstance.yaml
      - $ref: ./PlatformTitleInstance.yaml
      - $ref: ./PackageContentItem.yaml
      - $ref: ./Package.yaml
    discriminator:
      propertyName: class
      mapping:
        org.olf.kb.TitleInstance: ./TitleInstance.yaml
        org.olf.kb.PlatformTitleInstance: ./PlatformTitleInstance.yaml
        org.olf.kb.PackageContentItem: ./PackageContentItem.yaml
        org.olf.kb.Pkg: ./Package.yaml

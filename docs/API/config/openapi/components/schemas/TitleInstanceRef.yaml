description: >-
  A lightweight representation of a title instance, used where a title
  references another title (e.g. `TitleInstance.relatedTitles`). Unlike the
  full `TitleInstance` representation, fields such as `class`, `dateCreated`
  and `coverage` are not populated on this partial view, and it does not
  nest further `relatedTitles`.
allOf:
  - $ref: ./ErmResource.yaml
  - properties:
      dateMonographPublished:
        type: string
        pattern: '^\d{4}(-((0[0-9])|(1[0-2]))(-(([0-2][0-9])|3[0-1]))?)?\$'
      firstAuthor:
        type: string
      firstEditor:
        type: string
      longName:
        type: string
        readOnly: true
      monographEdition:
        type: string
      monographVolume:
        type: string
      work:
        type: object
        properties:
          id:
            type: string
            format: uuid

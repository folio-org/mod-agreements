            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /erm/sts/template:
    get:
      tags:
        - String Templates
      summary: Refresh templated URLs
      description: 'Intended to trigger a background refresh of templated URLs for every Platform, re-running all applicable string templates. Currently a no-op: the refresh logic is disabled in the module, and this always returns an empty object.'
      operationId: refreshTemplatedUrls
      parameters:
        - $ref: '#/components/parameters/x-okapi-tenant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /erm/sts/template/{platformId}:
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - $ref: '#/components/parameters/platformId'
    get:
      tags:
        - String Templates
      summary: Get the string templates applicable to a Platform
      description: Resolves which string templates (both `urlProxier` and `urlCustomiser` context) apply to the given Platform id, based on each template's `idScopes` allowlist/denylist.
      operationId: getStringTemplatesForPlatform
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringTemplatesForPlatform'
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /export:
    description: Exports resources entitled (directly or via a package) across every agreement in the tenant. To scope this to a single agreement instead, use `/erm/sas/{agreementId}/resources/export/all/{format}`.
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - in: query
        name: subscriptionAgreementId
        description: Undocumented in the module descriptor, but honoured by the implementation -- if supplied, scopes the export to this one agreement, equivalent to using the agreement-scoped export path.
        required: false
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Export
      summary: Export all entitled resources as JSON
      operationId: exportAll
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportEntry'
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /export/{format}:
    description: Exports resources entitled (directly or via a package) across every agreement in the tenant, in the given format. To scope this to a single agreement instead, use `/erm/sas/{agreementId}/resources/export/all/{format}`.
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - $ref: '#/components/parameters/format'
      - in: query
        name: subscriptionAgreementId
        description: Undocumented in the module descriptor, but honoured by the implementation -- if supplied, scopes the export to this one agreement, equivalent to using the agreement-scoped export path.
        required: false
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Export
      summary: Export all entitled resources in a specified format
      description: '`format: kbart` returns a tab-separated KBART file (one row per Package Content Item; Platform Title Instances and directly-entitled Title Instances are silently skipped). Any other `format` value returns the same JSON shape as the plain `/export` path.'
      operationId: exportAllFormat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportEntry'
            text/tab-separated-value;charset=UTF-8:
              schema:
                type: string
                description: KBART-formatted TSV, with a header row followed by one row per Package Content Item.
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /export/current:
    description: Exports resources currently entitled (directly or via a package) across every agreement in the tenant -- i.e. `coverage`/`accessStart`/`accessEnd` windows that are active today. To scope this to a single agreement instead, use `/erm/sas/{agreementId}/resources/export/current/{format}`.
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - in: query
        name: subscriptionAgreementId
        description: Undocumented in the module descriptor, but honoured by the implementation -- if supplied, scopes the export to this one agreement, equivalent to using the agreement-scoped export path.
        required: false
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Export
      summary: Export currently entitled resources as JSON
      operationId: exportCurrent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportEntry'
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /export/current/{format}:
    description: Exports resources currently entitled (directly or via a package) across every agreement in the tenant, in the given format. To scope this to a single agreement instead, use `/erm/sas/{agreementId}/resources/export/current/{format}`.
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - $ref: '#/components/parameters/format'
      - in: query
        name: subscriptionAgreementId
        description: Undocumented in the module descriptor, but honoured by the implementation -- if supplied, scopes the export to this one agreement, equivalent to using the agreement-scoped export path.
        required: false
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Export
      summary: Export currently entitled resources in a specified format
      description: '`format: kbart` returns a tab-separated KBART file (one row per Package Content Item; Platform Title Instances and directly-entitled Title Instances are silently skipped). Any other `format` value returns the same JSON shape as the plain `/export/current` path.'
      operationId: exportCurrentFormat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportEntry'
            text/tab-separated-value;charset=UTF-8:
              schema:
                type: string
                description: KBART-formatted TSV, with a header row followed by one row per Package Content Item.
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /dashboard/definitions:
    get:
      tags:
        - Dashboard
      summary: List dashboard widget definitions
      description: |-
        Returns the dashboard widget definitions bundled with this module, describing the self-service search/list widgets (e.g. simple agreement search) that can be added to a FOLIO dashboard. Definitions are cached in memory after the first request, for the lifetime of the running instance. No specific permission is required beyond a valid tenant/token.

        This path is provided under the `dashboard` interface, declared as `interfaceType: multiple` in the module descriptor, because other dashboard-capable modules (e.g. mod-licenses) expose the same path for their own widget definitions. Since more than one module enabled for a tenant can answer this exact path, a plain request is ambiguous — Okapi needs an `X-Okapi-Module-Id` header naming which one to route to. Discover the candidate module ids first with `GET /_/proxy/tenants/{tenant}/modules?provide=dashboard`, then pass one of them back on this request.
      operationId: getDashboardDefinitions
      parameters:
        - $ref: '#/components/parameters/x-okapi-tenant'
        - $ref: '#/components/parameters/x-okapi-module-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardWidgetDefinition'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
components:
  securitySchemes:
    okapiToken:
      type: apiKey
      in: header
      name: x-okapi-token
    accessToken:
      type: apiKey
      in: cookie
      name: folioAccessToken
  parameters:
    x-okapi-tenant:
      in: header
      name: x-okapi-tenant
      required: true
      schema:
        type: string
    filters:
      in: query
      name: filters
      required: false
      schema:
        type: string
    match:
      in: query
      name: match
      required: false
      schema:
        type: string
    term:
      in: query
      name: term
      required: false
      schema:
        type: string
    sort:
      in: query
      name: sort
      required: false
      schema:
        type: string
    stats:
      in: query
      name: stats
      required: false
      schema:
        type: boolean
    perPage:
      in: query
      name: perPage
      required: false
      schema:
        type: integer
    offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
    page:
      in: query
      name: page
      required: false
      schema:
        type: integer
    agreementId:
      in: path
      name: agreementId
      description: UUID for an Agreement
      required: true
      schema:
        type: string
        format: uuid
    subset:
      in: path
      name: subset
      required: true
      schema:
        type: string
        enum:
          - current
          - all
    format:
      in: path
      name: format
      required: true
      schema:
        type: string
        enum:
          - json
          - kbart
    referenceId:
      in: query
      name: referenceId
      required: false
      schema:
        type: string
    resourceId:
      in: query
      name: resourceId
      required: false
      schema:
        type: string
    entitlementId:
      in: path
      name: entitlementId
      description: UUID for an Entitlement (Agreement line)
      required: true
      schema:
        type: string
        format: uuid
    entitlementLogEntryId:
      in: path
      name: entitlementLogEntryId
      description: UUID for an entitlement log entry
      required: true
      schema:
        type: string
        format: uuid
    packageId:
      in: path
      name: packageId
      description: UUID for a Package
      required: true
      schema:
        type: string
        format: uuid
    packageSubset:
      in: path
      name: packageSubset
      required: true
      schema:
        type: string
        enum:
          - current
          - dropped
          - future
          - all
    metadataId:
      in: path
      name: metadataId
      description: UUID for a PackageIngressMetadata record
      required: true
      schema:
        type: string
        format: uuid
    pciId:
      in: path
      name: pciId
      description: UUID for a PackageContentItem
      required: true
      schema:
        type: string
        format: uuid
    platformId:
      in: path
      name: platformId
      description: UUID for a Platform
      required: true
      schema:
        type: string
        format: uuid
    ptiId:
      in: path
      name: ptiId
      description: UUID for a PlatformTitleInstance
      required: true
      schema:
        type: string
        format: uuid
    titleId:
      in: path
      name: titleId
      description: UUID for a TitleInstance
      required: true
      schema:
        type: string
        format: uuid
    ermResourceId:
      in: path
      name: ermResourceId
      description: UUID for an ERM resource
      required: true
      schema:
        type: string
        format: uuid
    includeIds:
      in: query
      name: includeIds
      description: Whether to include the ids of affected resources in the response. Defaults to false
      required: false
      schema:
        type: boolean
        default: false
    kbId:
      in: path
      name: kbId
      description: UUID for a remote Knowledge Base
      required: true
      schema:
        type: string
        format: uuid
    orgId:
      in: path
      name: orgId
      description: UUID for an Org
      required: true
      schema:
        type: string
        format: uuid
    contactId:
      in: path
      name: contactId
      description: UUID for an Internal Contact
      required: true
      schema:
        type: string
        format: uuid
    refdataId:
      in: path
      name: refdataId
      description: UUID for a reference data category
      required: true
      schema:
        type: string
        format: uuid
    refdataDomain:
      in: path
      name: domain
      description: Simple (case-insensitive) name of the domain class that owns the property, e.g. `SubscriptionAgreement`, `Pkg`
      required: true
      schema:
        type: string
    refdataProperty:
      in: path
      name: property
      description: Name of the refdata-backed property on the domain class, e.g. `agreementStatus` (on `SubscriptionAgreement`)
      required: true
      schema:
        type: string
    custpropId:
      in: path
      name: custpropId
      description: UUID for a custom property definition
      required: true
      schema:
        type: string
        format: uuid
    jobId:
      in: path
      name: jobId
      description: UUID for a persistent job
      required: true
      schema:
        type: string
        format: uuid
    jobType:
      in: path
      name: jobType
      description: Unlike job creation, listing by type is not restricted to the types postable via /erm/jobs/{jobType} -- any PersistentJob subtype can be filtered on here, including types only ever created internally
      required: true
      schema:
        type: string
        enum:
          - comparison
          - coverageRegeneration
          - packageImport
          - kbartImport
          - packageIngest
          - supplementaryDocumentsCleaning
          - externalEntitlementSync
          - packageTriggerResync
          - titleIngest
          - resourceDeletion
          - eHoldingsEntitlementSync
          - identifierReassignment
    fileId:
      in: path
      name: fileId
      description: UUID for a file
      required: true
      schema:
        type: string
        format: uuid
    identifierId:
      in: path
      name: identifierId
      description: UUID for an Identifier
      required: true
      schema:
        type: string
        format: uuid
    validateProp:
      in: path
      name: prop
      description: Name of the single property to validate, e.g. `name` on `subscriptionAgreement`. Only this property is checked -- other constraints on the domain class (e.g. other required fields not present in the request body) are not evaluated.
      required: true
      schema:
        type: string
    settingId:
      in: path
      name: settingId
      description: Identifier for an application setting
      required: true
      schema:
        type: string
    stringTemplateId:
      in: path
      name: stringTemplateId
      description: UUID for a string template
      required: true
      schema:
        type: string
        format: uuid
    x-okapi-module-id:
      in: header
      name: X-Okapi-Module-Id
      required: true
      description: 'ID of the specific module to route this request to. Required on paths  backed by an `interfaceType: multiple` interface'
      schema:
        type: string
        example: mod-agreements-7.4.0-SNAPSHOT
  schemas:
    ResultsMeta:
      type: object
      properties:
        meta:
          type: object
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        totalRecords:
          type: integer
    Refdata:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
    AlternateName:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
          readOnly: true
          description: Agreements that owns the alternate name
    AgreementContentType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        contentType:
          $ref: '#/components/schemas/Refdata'
    InternalContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
        role:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        user:
          type: string
          format: uuid
    Organisation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        orgsUuid:
          type: string
          format: uuid
        orgsUuid_object:
          type: object
    AgreementOrg:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
          readOnly: true
          description: Agreement that owns the organisation
        org:
          $ref: '#/components/schemas/Organisation'
        primaryOrg:
          type: boolean
          description: Whether this is the primary organisation for the agreement
          default: false
        note:
          type: string
          description: A note about this organisation's relationship to the agreement
        roles:
          type: array
          description: The roles this organisation plays in relation to the agreement
          items:
            type: object
            required:
              - id
              - role
            properties:
              id:
                type: string
                format: uuid
                readOnly: true
              owner:
                $ref: '#/components/schemas/AgreementOrg'
                readOnly: true
              role:
                description: The role (e.g. Content provider)
                oneOf:
                  - type: string
                  - $ref: '#/components/schemas/Refdata'
              note:
                type: string
    File:
      type: object
      required:
        - id
        - name
        - size
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        contentType:
          type: string
          description: MIME type of the uploaded file
        modified:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          description: Original filename of the uploaded file
        size:
          type: integer
          description: Size of the uploaded file in bytes
    DocumentAttachment:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        dateCreated:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        location:
          type: string
        url:
          type: string
          format: uri
        note:
          type: string
        atType:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        fileUpload:
          $ref: '#/components/schemas/File'
    LinkedAmendment:
      type: object
      properties:
        amendmentId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        owner:
          type: string
          format: uuid
        status:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
    LinkedLicense:
      type: object
      properties:
        amendments:
          type: array
          items:
            $ref: '#/components/schemas/LinkedAmendment'
        id:
          type: string
        owner:
          type: string
          format: uuid
        remoteId:
          type: string
          format: uuid
        remoteId_object:
          type: object
        status:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
    UsageDataProvider:
      type: object
      properties:
        id:
          type: string
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
        remoteId:
          type: string
          format: uuid
        remoteId_object:
          type: object
    AgreementRelationshipAgreement:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        agreementStatus:
          $ref: '#/components/schemas/Refdata'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    AgreementRelationship:
      properties:
        id:
          type: string
          format: uuid
        type:
          oneOf:
            - type: string

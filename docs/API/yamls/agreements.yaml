          type: object
          description: The entitlement (agreement line) this row was exported for. Only a minimal subset of the entitlement is included here -- for the full record, look it up via `id` against `/erm/entitlements/{entitlementId}`.
          properties:
            id:
              type: string
              format: uuid
            suppressFromDiscovery:
              type: boolean
            tags:
              type: array
              items:
                $ref: '#/components/schemas/Tag'
        platform:
          allOf:
            - $ref: '#/components/schemas/Platform'
          description: Present when the resource is a Platform Title Instance or Package Content Item.
        suppressFromDiscovery:
          type: boolean
          description: Present when the resource is a Platform Title Instance or Package Content Item.
        embargo:
          allOf:
            - $ref: '#/components/schemas/Embargo'
          description: Present only for Package Content Item resources with an embargo.
        note:
          type: string
          description: Present only for Package Content Item resources with a note.
        url:
          type: string
          description: Present when the resource is a Platform Title Instance or Package Content Item and has a URL.
        templatedUrls:
          type: array
          description: URLs generated from String Templates (see `/erm/sts`) applicable to this resource's platform. Present when the resource is a Platform Title Instance or Package Content Item.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              url:
                type: string
        depth:
          type: string
          description: Present only for Package Content Item resources.
        coverage:
          type: array
          description: Coverage statements for this resource, or a custom coverage override if one applies (see `customCoverage`). Empty if there is no coverage.
          items:
            $ref: '#/components/schemas/CoverageStatement'
        customCoverage:
          type: boolean
          description: True if `coverage` is a custom override rather than the resource's own coverage statements.
        relatedTitles:
          type: array
          description: Related title instances, present only if the title has any.
          items:
            allOf:
              - $ref: '#/components/schemas/TitleInstance'
            description: A minimal title representation -- only id, name, type, publicationType, subType, identifiers and longName are populated.

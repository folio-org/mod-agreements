        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
          description: Internal server error
  /erm/sas/{agreementId}/resources/current:
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - $ref: '#/components/parameters/agreementId'
    get:
      tags:
        - Agreements
      summary: Returns resources in the internal KB associated with specified agreement actively part of the agreement on the current date
      operationId: getAgreementResourcesCurrent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErmResourceResults'
                  - $ref: '#/components/schemas/ErmResourceResultsArray'
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
          description: Internal server error
  /erm/sas/{agreementId}/resources/dropped:
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - $ref: '#/components/parameters/agreementId'
    get:
      tags:
        - Agreements
      summary: Returns resources in the internal KB associated with specified agreement which were actively part of the agreement in the past
      operationId: getAgreementResourcesDropped
      responses:
        '200':

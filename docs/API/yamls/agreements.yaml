  /erm/sas/{agreementId}/resources/static/all:
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - $ref: '#/components/parameters/agreementId'
    get:
      tags:
        - Agreements
      summary: Returns all resources in the internal KB associated with specified agreement based on direct HQL query
      operationId: getAgreementResourcesStaticAll
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErmResourceResults'
                  - $ref: '#/components/schemas/ErmResourceResultsArray'
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
